<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>20-Week Advanced Hypertrophy Tracker</title>
    <style>
        :root { --bg: #0a0c10; --card: #161b22; --accent: #238636; --text: #c9d1d9; --timer: #58a6ff; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 10px; margin: 0; display: flex; justify-content: center; }
        .wrapper { width: 100%; max-width: 500px; padding-bottom: 50px; }
        
        /* Header & Progress */
        .header { background: var(--card); padding: 20px; border-radius: 12px; border-left: 6px solid var(--accent); margin-bottom: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .date-display { font-size: 1.2rem; font-weight: 800; color: #fff; text-transform: uppercase; }
        .phase-display { font-size: 1rem; color: var(--accent); font-weight: 700; margin-top: 5px; }
        .week-display { font-size: 0.85rem; color: #8b949e; margin-top: 2px; }

        /* Workout Display */
        .focus-banner { font-size: 0.9rem; font-weight: 700; color: #000; background: var(--timer); display: inline-block; padding: 4px 12px; border-radius: 4px; margin-bottom: 15px; margin-left: 5px; }
        .ex-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 12px; border: 1px solid #30363d; position: relative; }
        .ex-name { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 5px; display: block; }
        .ex-stats { color: var(--accent); font-weight: 800; font-size: 0.9rem; margin-bottom: 8px; display: block; }
        .ex-notes { font-size: 0.85rem; color: #8b949e; line-height: 1.5; border-top: 1px solid #30363d; padding-top: 8px; margin-top: 5px; }

        .rest-day { text-align: center; padding: 50px 20px; color: #8b949e; font-style: italic; }
        .nav-ui { display: flex; justify-content: space-between; margin-top: 20px; }
        .nav-btn { background: #21262d; color: white; border: 1px solid #363b42; padding: 12px; border-radius: 8px; width: 48%; font-weight: 600; cursor: pointer; }
    </style>
</head>

    let workoutDB = [];

    function init() {
        const rows = planCSV.split('\n').slice(1);
        workoutDB = rows.map(r => {
            const c = r.split(',');
            return { phase: c[0], day: c[1], focus: c[2], ex: c[3], sets: c[4], reps: c[5], note: c[6] };
        });
        updateView();
    }

    function updateView() {
        const diffMs = activeDate - PROGRAM_START;
        const diffDays = Math.floor(diffMs / 86400000);
        const currentWeek = Math.floor(diffDays / 7) + 1;
        const phaseNum = Math.ceil(currentWeek / 4);
        const dayStr = activeDate.toLocaleDateString('en-US', { weekday: 'long' });

        // MOVE THIS LINE ABOVE THE RANGE CHECK:
        document.getElementById('ui-date').innerText = activeDate.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        
        if (currentWeek < 1 || currentWeek > 20) {
            document.getElementById('ui-phase').innerText = "Program Start: Jan 5, 2026";
            document.getElementById('ui-week').innerText = "Status: Pre-Program / Finished";
            document.getElementById('workout-area').innerHTML = `<div class="rest-day">Currently viewing a date outside the 20-week program. <br><br> Use the "Tomorrow" button to skip to Jan 5.</div>`;
            return;
        }

        document.getElementById('ui-phase').innerText = `Phase ${phaseNum}`;
        document.getElementById('ui-week').innerText = `Week ${currentWeek} of 20`;

        // Filter for specific Phase String (matches CSV e.g. "Phase 1 (Weeks 1-4)")
        const currentPhaseStr = `Phase ${phaseNum}`;
        const todaysExercises = workoutDB.filter(row => row.phase.startsWith(currentPhaseStr) && row.day === activeDate.toLocaleDateString('en-US', { weekday: 'long' }));

        const area = document.getElementById('workout-area');
        if (todaysExercises.length > 0) {
            let html = `<div class="focus-banner">${todaysExercises[0].focus}</div>`;
            todaysExercises.forEach(ex => {
                html += `
                <div class="ex-card">
                    <span class="ex-name">${ex.ex}</span>
                    <span class="ex-stats">${ex.sets} SETS × ${ex.reps} REPS</span>
                    <div class="ex-notes">${ex.note}</div>
                </div>`;
            });
            area.innerHTML = html;
        } else {
            area.innerHTML = `<div class="rest-day">Rest Day. Hydrate, eat, and prioritize sleep for growth.</div>`;
        }
    }

    function adjDate(n) {
        activeDate.setDate(activeDate.getDate() + n);
        updateView();
    }
